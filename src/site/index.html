<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
<title>ghindex — search GitHub Pages sites</title>
<meta name="description" content="Search GitHub Pages sites live. Results come from GitHub as you type and are link-checked as they load." />
<meta name="color-scheme" content="dark light" />
<meta name="theme-color" content="#0b0e14" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<!--
  Edge search worker.

  This project is served from *.github.io, a domain Cloudflare cannot sit in
  front of, so the worker runs on its own hostname and is called cross-origin.
  Keeping the token server-side means repeat queries are served from an edge
  cache instead of each visitor spending their own GitHub rate limit, and it is
  the only way to liveness-check a result, since a browser cannot make a
  cross-origin HEAD and get an answer.

  Clear this value and the page talks to GitHub directly instead, using each
  visitor's own IP budget. Search works either way, so a worker outage is a
  slower search rather than a broken one.
-->
<meta name="ghindex-edge" content="https://ghindex-search.ghindex.workers.dev" />
<style>
  /* ---------------------------------------------------------------------
     Design tokens. One scale for colour, radius and motion so the two themes
     stay in step. Light is the default; dark is opt-in via the user's system
     preference.
     --------------------------------------------------------------------- */
  :root {
    color-scheme: light dark;

    --bg:          #ffffff;
    --surface:     #ffffff;
    --surface-2:   #f7f8fa;
    --fg:          #14161a;
    --fg-muted:    #5b6472;
    --fg-subtle:   #858e9c;
    --border:      #e4e7ec;
    --border-soft: #eef0f3;
    --accent:      #4f46e5;
    --accent-fg:   #ffffff;
    --accent-soft: #eef2ff;
    --chip:        #f2f4f7;
    --chip-border: #e4e7ec;
    --live:        #1a7f4b;
    --blocked:     #8a6d1f;
    --gone:        #a33;
    --star:        #b8860b;

    --r-sm: 6px;
    --r-md: 10px;
    --r-lg: 14px;
    --r-full: 999px;

    --shadow-sm: 0 1px 2px rgb(16 24 40 / .05);
    --shadow-md: 0 4px 12px -2px rgb(16 24 40 / .08), 0 2px 4px -2px rgb(16 24 40 / .04);

    --ease: cubic-bezier(.2, .7, .3, 1);
    --fast: 120ms var(--ease);
    --med:  200ms var(--ease);

    --maxw: 680px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg:          #0b0e14;
      --surface:     #12161f;
      --surface-2:   #171c26;
      --fg:          #e8ebf0;
      --fg-muted:    #99a2b0;
      --fg-subtle:   #6b7480;
      --border:      #232936;
      --border-soft: #1b202a;
      --accent:      #7c8cff;
      --accent-fg:   #0b0e14;
      --accent-soft: #1a1f38;
      --chip:        #1a1f29;
      --chip-border: #262d3a;
      --live:        #4ec98a;
      --blocked:     #d9b64a;
      --gone:        #e0756a;
      --star:        #d9b64a;
      --shadow-sm: 0 1px 2px rgb(0 0 0 / .4);
      --shadow-md: 0 4px 14px -2px rgb(0 0 0 / .5);
    }
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 400 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif,
          "Apple Color Emoji", "Segoe UI Emoji";
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  a { color: var(--accent); }

  :where(a, button, input, [tabindex]):focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: var(--r-sm);
  }

  /* ---------------------------------------------------------- hero */

  /*
     One wide container, and a narrower hero inside it.

     The container runs nearly the full width of the window — tags and results
     both want the room, and a result list constrained to 680px left most of a
     desktop screen empty while rows of text ended early. The hero stays
     narrower so the search field keeps a sane measure and its centre lands on
     the centre of the viewport rather than the centre of a column.

     Everything is centred: the search box's midpoint, the title, and the tag
     band all resolve to the same vertical line, so the eye lands in one place.
  */
  main {
    max-width: 1200px;
    margin: 0 auto;
    /* No bottom padding: with the help line as the last element, padding here
       would push it off the bottom and make the page scroll before the visitor
       has done anything. The hero's own gap provides all the breathing room. */
    padding: 0 clamp(1.25rem, 4vw, 3rem);
  }

  /*
     The hero fills the viewport and centres everything the visitor sees before
     typing: title, subtitle, box, help, and the topic row. One block, so nothing
     floats away from anything else.

     This was a viewport-tall hero with the topics left outside it, and the
     screenshot showed the result: a full screen of nothing between the help line
     and the first chip. Centring them together removes the void and costs nothing
     — the topic row is only ~65px, so the search box still lands within a few
     pixels of the middle.

     `svh`, not `vh`: on mobile `vh` is the height with browser chrome hidden, so
     a 100vh hero scrolls its own content under the URL bar as the chrome collapses.
  */
  .hero {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    /* One gap between the help line and the topic row. Before this the two were
       separated by the whole height of the hero. */
    gap: 1.9rem;
  }

  /*
     The inner block carries the reading measure; the topic row deliberately does
     not. At 820px the chips wrap into a tall narrow column, and a broad set of
     small options wants the width.
  */
  .hero-inner {
    text-align: center;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    /*
       The box does not land on the true centre when the group does, because the
       group is not symmetric about the box: the title and subtitle above it total
       slightly more height than the help line and topic row below it, so the box
       drifts a few pixels high. Left at zero it measured 13px low on desktop and
       49px low on mobile, where the topic row wraps to more lines. verify-browser.ts
       pins the result at desktop so this cannot drift again; the mobile figure is
       inside the tolerance because a phone has no room to be exact.
    */
    padding-top: 0;
  }

  /*
     Once there are results, the hero gives its height back, so answers appear
     where the eye already is instead of a screen down.

     `:has()` rather than a class toggled from script, so the layout cannot drift
     out of sync with the state that causes it.
  */
  main:has(#results > *) .hero {
    min-height: 0;
    padding: clamp(2rem, 7vh, 4rem) 0 clamp(1rem, 3vh, 1.75rem);
    gap: 1.4rem;
  }

  h1 {
    margin: 0;
    font-size: clamp(2rem, 7vw, 2.9rem);
    font-weight: 680;
    letter-spacing: -.03em;
    line-height: 1.1;
  }

  .tagline {
    margin: .6rem 0 0;
    color: var(--fg-muted);
    font-size: clamp(1rem, 2.4vw, 1.1rem);
  }

  /* ---------------------------------------------------------- search */

  .searchbox { position: relative; margin-top: 2rem; }

  .searchbox svg {
    position: absolute;
    left: 1rem; top: 50%;
    translate: 0 -50%;
    width: 18px; height: 18px;
    color: var(--fg-subtle);
    pointer-events: none;
  }

  input[type=search] {
    width: 100%;
    padding: .95rem 1rem .95rem 2.9rem;
    font: inherit;
    font-size: 1.05rem;
    color: var(--fg);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-sm);
    transition: border-color var(--fast), box-shadow var(--fast);
  }
  input[type=search]::placeholder { color: var(--fg-subtle); }
  input[type=search]:hover {
    border-color: color-mix(in srgb, var(--border) 60%, var(--fg-subtle));
  }
  input[type=search]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
  }
  input[type=search]::-webkit-search-cancel-button { cursor: pointer; }

  /*
     The help line: the closing sentence about what this is and where the results
     come from. Last in the centred block, directly under the topics.

     Quiet by design — it is a footnote, not a call to action — but `--fg-muted`
     rather than `--fg-subtle`, because at 0.78rem this is text a reader is
     expected to be able to read.
  */
  .helpline {
    margin: 0 auto;
    max-width: 58ch;
    color: var(--fg-muted);
    font-size: .78rem;
    line-height: 1.5;
    text-align: center;
  }

  /* ---------------------------------------------------------- tag picker */

  /*
     Tags, for someone who would rather browse than type. A curated list rather
     than every tag GitHub has, because GitHub has 11,677 distinct ones and 72%
     of those appear exactly once: a complete list would be 11,677 buttons, most
     of which lead to nothing. This is the set of tags that reliably mean
     something, so it is short enough to scan.
  */
  /*
     No top margin: the gap to the help line comes from the hero's flex `gap`, so
     there is exactly one value controlling the space and it does not double up.
  */
  .tagpick { margin-top: 0; }

  /*
     The picker is a quiet centred cloud and nothing else.

     Three earlier shapes were wrong and each was caught by looking at the
     rendered page rather than by a failing test:

     - an uppercase letterspaced "BROWSE BY TOPIC" heading: a dated label that
       announced a control the reader had not asked about, and "browse" was never
       accurate since picking a chip is one query, not a walk through results;
     - full-weight chips, which made the picker the loudest thing on a page whose
       actual subject is the search box;
     - collapsing the list to one line behind an "all 83" control, which truncated
       mid-row and read as a rendering fault rather than a choice.

     So: no heading, no truncation, and low-contrast chips that hold the eye at
     the search box. Height is not the problem it was with large chips — small
     ones wrap into a block that reads as deliberate.
  */
  .taglist {
    display: flex;
    flex-wrap: wrap;
    gap: .25rem .3rem;
    justify-content: center;
  }

  .tagbtn {
    padding: .15rem .5rem;
    font: inherit;
    font-size: .74rem;
    line-height: 1.5;
    color: var(--fg-muted);
    background: transparent;
    border: 1px solid var(--border-soft);
    border-radius: var(--r-full);
    cursor: pointer;
    transition: color var(--fast), border-color var(--fast), background var(--fast);
  }
  .tagbtn:hover {
    color: var(--accent);
    border-color: color-mix(in srgb, var(--border) 45%, var(--accent));
    background: var(--accent-soft);
  }
  .tagbtn[aria-pressed=true] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-fg);
    font-weight: 600;
  }

  /* The expander. Styled as a peer of the tags rather than a control of its own,
     so it reads as "there is more here" instead of as a button in the layout. */
  .tagmore {
    padding: .15rem .5rem;
    font: inherit;
    font-size: .74rem;
    line-height: 1.5;
    color: var(--fg-subtle);
    background: transparent;
    border: 1px dashed var(--border);
    border-radius: var(--r-full);
    cursor: pointer;
    transition: color var(--fast), border-color var(--fast);
  }
  .tagmore:hover { color: var(--accent); border-color: var(--accent); }

  /* ---------------------------------------------------------- results */

  /*
     Results start below the fold on a short viewport and are full width of the
     column. They are the reason the page exists, so once there are some they
     are allowed to push the hero off rather than sharing space with it.
  */
  #results {
    margin-top: 2.5rem;
    display: flex;
    flex-direction: column;
    gap: .5rem;
  }
  #results:empty { margin-top: 0; }

  /* The "show more" control is a pill like the tag buttons, so it does not read
     as a different kind of thing. It sits centred under the results. */
  #more { display: block; margin: .9rem auto 0; padding: .4rem .9rem; }

  .note {
    margin: .2rem 0 0;
    color: var(--fg-subtle);
    font-size: .78rem;
    text-align: center;
  }
  .note.warn { color: var(--fg-muted); }

  .empty {
    padding: 2.5rem 1rem;
    text-align: center;
    color: var(--fg-muted);
    border: 1px dashed var(--border);
    border-radius: var(--r-lg);
    background: var(--surface-2);
  }

  .row {
    padding: .9rem 1.05rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-sm);
    transition: box-shadow var(--med), border-color var(--med);
  }
  .row:hover {
    border-color: color-mix(in srgb, var(--border) 50%, var(--accent));
    box-shadow: var(--shadow-md);
  }

  /* The title carries the pills, so it is a flex row that may wrap. */
  .row h3 {
    margin: 0;
    font-size: .95rem;
    font-weight: 600;
    letter-spacing: -.006em;
    display: flex;
    align-items: baseline;
    gap: .35rem;
    flex-wrap: wrap;
  }
  .row h3 a {
    text-decoration: none;
    /* A long owner/repo is the common case, not the exception, so it is allowed
       to break rather than pushing the badges onto their own line. */
    word-break: break-word;
    min-width: 0;
  }
  .row h3 a:hover { text-decoration: underline; text-underline-offset: 2px; }

  .url {
    color: var(--fg-subtle);
    font-size: .75rem;
    word-break: break-all;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    margin-top: .2rem;
  }

  .desc {
    color: var(--fg-muted);
    font-size: .875rem;
    margin-top: .4rem;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /*
     Topics per row are de-emphasised hard: the picker above already offers
     topics, so repeating them at full strength on every row is noise competing
     with the thing a visitor actually reads, which is the title and the link.
  */
  .tags { display: flex; gap: .25rem; flex-wrap: wrap; margin-top: .5rem; }
  .tag {
    font-size: .66rem;
    padding: .05rem .4rem;
    border-radius: var(--r-full);
    background: transparent;
    border: 1px solid var(--border-soft);
    color: var(--fg-subtle);
  }

  /*
     Liveness verdicts and star counts. Both are small pills beside the title.
     They are toned down on purpose: a dead link is worth flagging, but it is
     not a dramatic event, and the site may come back.
  */
  .pill {
    display: inline-block;
    flex: none;
    font-size: .62rem;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    padding: .1rem .4rem;
    border-radius: var(--r-full);
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .pill.live-checking { opacity: .55; font-style: italic; }
  .pill.live-alive    { color: var(--live); border-color: color-mix(in srgb, var(--live) 45%, transparent); background: transparent; }
  .pill.live-blocked  { color: var(--blocked); border-color: color-mix(in srgb, var(--blocked) 45%, transparent); background: transparent; }
  .pill.live-gone     { color: var(--gone); border-color: color-mix(in srgb, var(--gone) 45%, transparent); background: transparent; }
  .pill.live-unknown  { opacity: .7; background: transparent; }
  .pill.stars {
    background: transparent;
    border-color: var(--star);
    color: var(--star);
    font-variant-numeric: tabular-nums;
  }

  /* A confirmed dead row is dimmed rather than removed: a transient failure
     should not hide a result, and the dead link is still a fact worth seeing. */
  .row.is-gone { opacity: .55; }
  .row.is-gone .url { text-decoration: line-through; text-decoration-thickness: 1px; }

  /* ---------------------------------------------------------- misc */

  /* The scroll sentinel: a 1px target for the IntersectionObserver that pages
     results in. It carries no visual weight and must not add height. */
  .sentinel { height: 1px; }

  .sr {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  [hidden] { display: none !important; }

  /* The help line is the last element in the document flow before the results,
     so nothing sits below it on arrival and the page does not scroll. */

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>
<main>
  <noscript>
    <p class="note warn">
      This search needs JavaScript: results are requested from GitHub as you type
      and link-checked as they arrive, which a static page cannot do. You can
      still search GitHub directly:
      <a href="https://github.com/search?q=topic%3Agithub-pages&amp;type=repositories">github.com/search</a>
    </p>
  </noscript>

  <!--
    The hero is title, subtitle, box, help and topics as one centred block.

    The topic row used to sit outside this, after a hero that filled the viewport,
    which left a screen of empty space between the help line and the first chip.
    Everything the visitor sees before typing now centres together, so the page
    reads as one thing rather than a search box floating above a distant footer.

    The topics sit inside the hero but are not width-capped with it: they are a
    broad set of options, not prose, and at the search box's measure they wrap
    into a tall narrow column. So the inner block carries the cap and the topic
    row does not.
  -->
  <div class="hero">
    <div class="hero-inner">
      <h1>ghindex</h1>
      <p class="tagline">Live search of GitHub Pages sites.</p>

      <form role="search" class="searchbox" id="f">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" />
        </svg>
        <label class="sr" for="q">Search GitHub for Pages sites</label>
        <input id="q" name="q" type="search" autocomplete="off" spellcheck="false"
               placeholder="Search owner, repo, title or topic…" />
      </form>
    </div>

    <!--
      Topic picker. Every tag here describes what a site *is* rather than what it
      was built with: browsing by technology is how you end up looking at a
      thousand React sites and no portfolio. Clicking one searches for it, and
      clicking it again clears the selection.
    -->
    <section class="tagpick" aria-label="Browse by topic">
      <div class="taglist" id="taglist"></div>
    </section>

    <!--
      The help line: the closing sentence about what this is and where the data
      comes from. It is the last line of the centred block, so it sits directly
      under the topics and the whole pre-search view fits one screen with no
      scrolling.

      It was a separate <footer> pinned to the bottom of the document, which meant
      the page was always taller than the viewport: a visitor who scrolled found
      a second half with a sentence and a rule in it, and had to work out whether
      it was part of the page or a stray artifact. There is now nowhere to scroll
      to before results appear.
    -->

    <p class="helpline">
      ghindex is an independent project and is not affiliated with GitHub. Results
      come straight from GitHub and are link-checked as they load.
    </p>
  </div>

  <div id="results"></div>
  <div class="sentinel" id="sentinel" hidden></div>
</main>

<script type="module" src="./app.js"></script>
</body>
</html>
