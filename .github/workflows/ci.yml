name: ci

# Fast feedback on pull requests. Everything here is a pure check against the
# committed source: there is no data to validate and nothing to regenerate, so
# CI must not spend API rate limit on a PR.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The site is plain JavaScript and the checks are TypeScript run by bun;
      # no npm install needed.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # No GITHUB_TOKEN here: these are pure checks against committed data, so
      # CI must not spend API rate limit on a PR.

      - name: Category classifier
        run: bun run src/site/taxonomy-test.ts

      - name: Live GitHub search
        run: bun run src/publish/test-wide-search.ts

      # The edge worker had no CI step at all, so its proxy allowlist, token
      # fallback and liveness verdicts were only ever checked by hand.
      - name: Edge worker
        run: bun run worker/test-worker.ts

      # Guards the live-only shape of the page: no index is fetched, and the
      # example queries it offers are still worth offering.
      - name: Front end has no local index
        run: bun run test:front-end

      - name: CI compatibility self-test
        run: bun run src/quality/test-ci-compat.ts

      - name: Browser verification
        run: |
          # ubuntu-latest ships Chrome, but make it explicit so a runner image
          # change cannot silently skip this gate.
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "::error::no Chromium browser on the runner; cannot verify the UI"
            exit 1
          fi
          echo "using $CHROME"
          export CHROME_PATH="$CHROME"

          bun run serve.ts &
          SERVER=$!
          # Poll the server rather than sleeping a fixed amount. There is no
          # manifest to wait for any more, so poll the page itself.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8099/index.html > /dev/null; then break; fi
            sleep 1
          done
          bun run src/quality/verify-browser.ts || { kill $SERVER 2>/dev/null; exit 1; }
          kill $SERVER 2>/dev/null || true