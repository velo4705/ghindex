name: ci

# Fast feedback on pull requests. The nightly refresh-index workflow is the
# thing that actually updates the data; this one exists so a bad classifier
# change or a bloated payload is caught BEFORE it reaches the default branch,
# not a day later.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # No GITHUB_TOKEN here: these are pure checks against committed data, so
      # CI must not spend API rate limit on a PR.

      - name: URL resolution
        run: bun run src/index/test-urls.ts

      - name: Category classifier
        run: bun run src/classify/test.ts

      - name: Search correctness
        run: bun run src/publish/test-search.ts

      - name: On-demand GitHub search
        run: bun run src/publish/test-wide-search.ts

      # The edge worker had no CI step at all, so its proxy allowlist, token
      # fallback and liveness verdicts were only ever checked by hand.
      - name: Edge worker
        run: bun run worker/test-worker.ts

      - name: Landing page shelves
        run: bun run src/publish/test-landing.ts

      - name: Star quota
        run: bun run src/publish/test-star-quota.ts

      - name: Generate static pages, then verify them
        run: |
          bun run build
          bun run pages
          bun run reports
          bun run test:pages

      - name: Index health
        run: bun run src/quality/health.ts --max-age-hours 168

      - name: Performance budget
        run: bun run src/quality/perf-budget.ts

      - name: Anomaly detector self-test
        run: bun run src/quality/test-anomaly.ts

      - name: CI compatibility self-test
        run: bun run src/quality/test-ci-compat.ts

      - name: Browser verification
        run: |
          # ubuntu-latest ships Chrome, but make it explicit so a runner image
          # change cannot silently skip this gate.
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "::error::no Chromium browser on the runner; cannot verify the UI"
            exit 1
          fi
          echo "using $CHROME"
          export CHROME_PATH="$CHROME"

          bun run serve.ts &
          SERVER=$!
          # Poll the server rather than sleeping a fixed amount.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8099/data/manifest.json > /dev/null; then break; fi
            sleep 1
          done
          bun run src/quality/verify-browser.ts || { kill $SERVER 2>/dev/null; exit 1; }
          kill $SERVER 2>/dev/null || true

      - name: Verify the build is reproducible (idempotent)
        run: |
          bun run src/publish/test-idempotent.ts
          bun run build
          # Generated pages must also be committed and current, otherwise a
          # merged change can ship a stale sitemap that references dead pages.
          bun run pages
          bun run reports
          if [ -n "$(git status --porcelain src/site)" ]; then
            echo "::error::src/site is stale — run 'bun run publish' and commit the result"
            git status --porcelain src/site | head -20
            exit 1
          fi
          echo "src/site matches the corpus"
