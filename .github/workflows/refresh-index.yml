name: refresh index

# The published index is a build artifact committed into dist/. This workflow
# refreshes it on a schedule, committing only shards whose content changed.
#
# Why commit data at all: GitHub Pages serves static files only, so the search
# index must exist as files in the repo. Changed-shard-only writes (see
# src/publish/build.ts) keep each commit small.
on:
  schedule:
    # 03:17 UTC daily. Off-the-hour to avoid the Actions scheduling spike.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The harvester/prober are TypeScript run by bun; no npm install needed.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Harvest new Pages repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Incremental by design: completes only shards not yet recorded in
          # src/index/data/shards.json, then stops. Safe to run repeatedly.
          BUDGET_MS: 1800000
        run: bun run src/discover/harvest.ts

      - name: Probe liveness (respects the due schedule)
        run: bun run src/index/probe.ts

      # ---- correctness gates (fail fast, before anything is published) ----

      - name: Verify URL resolution
        run: bun run src/index/test-urls.ts

      - name: Verify category classifier
        run: bun run src/classify/test.ts

      - name: Build static index
        run: bun run src/publish/build.ts

      - name: Verify search correctness against published shards
        run: bun run src/publish/test-search.ts

      # ---- health + perf gates (fail if the index rots or bloats) ----

      - name: Check index health
        run: bun run src/quality/health.ts --max-age-hours 48

      - name: Enforce performance budget
        run: bun run src/quality/perf-budget.ts

      - name: Detect harvest/probe anomalies
        run: bun run src/quality/anomaly.ts

      - name: Verify the UI in a real browser
        run: |
          bun run serve.ts &
          SERVER=$!
          sleep 3
          bun run src/quality/verify-browser.ts || { kill $SERVER; exit 1; }
          kill $SERVER

      - name: Commit changed shards
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/site/data src/index/data
          if git diff --staged --quiet; then
            echo "index unchanged - nothing to commit"
            exit 0
          fi
          git commit -m "chore(index): refresh ($(git diff --staged --numstat | wc -l) files)"
          git push

      # Pages deploys from the branch that serves the site, so a push to the
      # default branch is what triggers the actual site update.
