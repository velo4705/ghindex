name: deploy pages

# Deploys src/site to GitHub Pages.
#
# The site is fully static, so this uses the official Pages artifact upload
# rather than pushing to a gh-pages branch. Requires the repository setting
# "GitHub Actions" as the Pages source, and permissions to deploy.
on:
  push:
    branches: [main]
    paths:
      - "src/site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, and never cancel one mid-upload: a cancelled
# deploy can leave the live site pointing at a half-published state.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Use the same setup action as ci.yml. The shell installer was tried here
      # and broke: it writes ~/.bun/bin to ~/.bash_profile, which non-interactive
      # GitHub Actions steps never source, so `bun` stayed "command not found".
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # Stamp the commit into the asset URLs.
      #
      # Pages serves static files with `cache-control: max-age=600`, so a browser
      # that loaded the site before a deploy keeps running the previous app.js for
      # up to ten minutes. During that window it silently star-sorted "best match"
      # results, because the old client-side sort had not been replaced yet and the
      # new one was never fetched. A per-deploy query string changes the URL, so the
      # cache cannot satisfy the new page with the old script.
      - name: Verify the committed site
        run: |
          set -euo pipefail
          bun --version
          bun run test:front-end

      - name: Stamp the build into asset URLs
        # Runs after the verification above, not before it. The front-end check
        # calls Bun.build, which resolves dynamic imports as filesystem paths and
        # cannot resolve "./module.js?v=<sha>"; stamping first would make the
        # build fail on files the browser loads perfectly well.
        run: |
          set -euo pipefail
          sha="$(git rev-parse --short HEAD)"
          # One filename per iteration rather than one alternation.
          #
          # The earlier single-expression version needed a `"` inside a
          # double-quoted shell string to cope with the attribute quoting, which
          # closed the string early and failed the whole job with an "unexpected
          # EOF". There are only three files and they are referenced only from
          # index.html, so a plain loop needs no quoting gymnastics at all.
          for name in app github-search taxonomy; do
            sed -i -E "s#(\./)?${name}\.js#${name}.js?v=${sha}#g" src/site/index.html
          done
          # The other two are reached by dynamic import from inside app.js, not by
          # a script tag, so stamping index.html alone left them cacheable under
          # their bare names and the stale-module problem moved one level down.
          for name in github-search taxonomy; do
            sed -i -E "s#\./${name}\.js#./${name}.js?v=${sha}#g" src/site/app.js
          done
          # Fail loudly if either stamp did not land. A silently unstamped build is
          # precisely the stale-script problem this step exists to prevent, so it
          # must not be allowed to pass quietly.
          grep -qE "app\.js\?v=${sha}" src/site/index.html
          grep -qE "\./github-search\.js\?v=${sha}" src/site/app.js
          grep -qE "\./taxonomy\.js\?v=${sha}" src/site/app.js
          grep -oE "[a-z-]+\.js\?v=[a-f0-9]+" src/site/index.html src/site/app.js

      # The whole site is committed, so a plain upload of src/site is enough.
      # There is no index to go stale, but the static assets still have to be
      # internally consistent, so the front-end shape check runs here too.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
