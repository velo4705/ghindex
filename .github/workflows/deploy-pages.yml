name: deploy pages

# Deploys src/site to GitHub Pages.
#
# The site is fully static, so this uses the official Pages artifact upload
# rather than pushing to a gh-pages branch. Requires the repository setting
# "GitHub Actions" as the Pages source, and permissions to deploy.
on:
  push:
    branches: [main]
    paths:
      - "src/site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, and never cancel one mid-upload: a cancelled
# deploy can leave the live site pointing at a half-published state.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Use the same setup action as ci.yml. The shell installer was tried here
      # and broke: it writes ~/.bun/bin to ~/.bash_profile, which non-interactive
      # GitHub Actions steps never source, so `bun` stayed "command not found".
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # Stamp the commit into the asset URLs.
      #
      # Pages serves static files with `cache-control: max-age=600`, so a browser
      # that loaded the site before a deploy keeps running the previous app.js for
      # up to ten minutes. During that window it silently star-sorted "best match"
      # results, because the old client-side sort had not been replaced yet and the
      # new one was never fetched. A per-deploy query string changes the URL, so the
      # cache cannot satisfy the new page with the old script.
      - name: Stamp the build into asset URLs
        run: |
          set -euo pipefail
          sha="$(git rev-parse --short HEAD)"
          # Rewrite only the local site's asset references, never the committed
          # files, so the checkout stays clean for the upload step.
          for f in src/site/*.html; do
            sed -i -E "s#(\./)?((app|github-search|taxonomy)\.js)(\?[^"'\)]*)?#\2?v=${sha}#g" "$f"
          done
          grep -o 'app.js?v=[a-f0-9]*' src/site/index.html

      # The whole site is committed, so a plain upload of src/site is enough.
      # There is no index to go stale, but the static assets still have to be
      # internally consistent, so the front-end shape check runs here too.
      - name: Verify the committed site
        run: |
          set -euo pipefail
          bun --version
          bun run test:front-end

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
